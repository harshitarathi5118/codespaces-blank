<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>📚 Student Attendance Management System</h1>

        <button id="themeBtn">🌙 Dark Mode</button>
    </header>

    <div class="dashboard">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Present</h3>
            <p id="presentStudents">0</p>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <p id="absentStudents">0</p>
        </div>

        <div class="card">
            <h3>Attendance %</h3>
            <p id="attendancePercentage">0%</p>
        </div>

    </div>

    <div class="controls">

        <input
        type="text"
        id="studentName"
        placeholder="Enter Student Name">

        <button onclick="addStudent()">
            Add Student
        </button>

        <button onclick="exportCSV()">
            Export CSV
        </button>

    </div>

    <input
    type="text"
    id="searchInput"
    placeholder="🔍 Search Student">

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
